<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クリエイティブ進行表</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  /* layout: one-column run sheet. 案件 = ticket stubs, then 締切 chips, month grid, day-by-day list. One colour per 案件, like stages on a festival timetable. Single dark "venue" theme by choice. */
  --bg:#0c0b11;
  --panel:#15141c;
  --panel2:#1d1b26;
  --line:#2f2c3b;
  --line-soft:#242230;
  --ink:#f4f0e6;
  --mute:#a09cae;
  --accent:#ffc640;
  --accent-ink:#1a1405;
  --critical:#ff5a6a;
  --ok:#63d6a0;
  --sat:#86b6ff;
  --sun:#ff9292;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Big Shoulders Display","Bahnschrift","Avenir Next Condensed","Arial Narrow","Roboto Condensed","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0 0 auto 0;height:440px;pointer-events:none;
  background:
    radial-gradient(46% 100% at 50% -18%,rgba(255,198,64,.16),transparent 70%),
    radial-gradient(34% 80% at 8% -12%,rgba(255,111,177,.10),transparent 70%),
    radial-gradient(34% 80% at 92% -12%,rgba(95,208,255,.10),transparent 70%)}
h1,h2,h3,p,ul,ol,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}

.wrap{position:relative;max-width:1120px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:36px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font:600 12px/1 var(--f-num);letter-spacing:.34em;color:var(--accent);text-transform:uppercase}
h1{font:400 clamp(28px,7.4vw,50px)/1.12 var(--f-display);letter-spacing:.02em;margin-top:10px;text-wrap:balance}
.top-l{flex:1 1 260px;min-width:0}
.today{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:rgba(21,20,28,.7)}
.today-k{font:600 11px/1 var(--f-num);letter-spacing:.3em;color:var(--mute)}
.today-d{font:800 26px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent)}
.today-w{font:600 14px/1 var(--f-num);letter-spacing:.12em}
.summary{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:-18px}
.stat{display:inline-flex;align-items:baseline;gap:7px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.stat b{font:800 18px/1 var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.stat.warn{border-color:rgba(255,90,106,.55);color:#ffc0c6}
.stat.warn b{color:var(--critical)}

/* ---------- sections ---------- */
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;gap:14px}
.sec-h h2{font:700 20px/1.2 var(--f-body);letter-spacing:.04em;white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--accent),rgba(255,198,64,0))}
.sec-h .eyebrow{display:none}
.hint{font-size:13px;color:var(--mute);max-width:65ch}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#4a4660}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-attach{border-style:dashed;border-color:rgba(255,198,64,.7);color:var(--accent);background:rgba(255,198,64,.06)}
.btn-attach:hover{background:rgba(255,198,64,.12);border-color:var(--accent)}
.btn-ghost{background:transparent}
.btn-line{min-height:32px;padding:0 12px;background:transparent;border-color:rgba(255,198,64,.55);color:var(--accent);font-size:13px}
.btn-line:hover{background:rgba(255,198,64,.1);border-color:var(--accent)}
.btn-danger{background:transparent;border-color:rgba(255,90,106,.5);color:#ff9aa5}
.btn-danger.armed{background:var(--critical);border-color:var(--critical);color:#1b0508}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mute);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--line);background:var(--panel2)}
.icon-btn svg{width:17px;height:17px}
input:focus-visible+label.btn{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- composer ---------- */
.composer{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.composer input[type=text]{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;min-width:0;width:100%}
.composer-actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.ro .composer,.ro #c-hint,.ro .btn-line,.ro [data-act="add-task"],.ro [data-act="edit-task"],.ro #sample-note{display:none}

/* ---------- 案件 tickets ---------- */
.pj-list{display:flex;flex-direction:column;gap:10px}
.pj{display:grid;grid-template-columns:6px 82px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.pj .band{background:var(--c)}
.stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 6px;border-right:1px dashed #4a4660;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;right:-8px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.stub-d{font:800 30px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:.01em}
.stub-d.tbd{color:var(--mute);font-size:24px}
.stub-w{font:600 12px/1.1 var(--f-num);letter-spacing:.1em;color:var(--ink)}
.stub-y{font:600 11px/1 var(--f-num);letter-spacing:.2em;color:var(--mute)}
.pj-b{padding:12px 14px 13px 18px;display:flex;flex-direction:column;gap:7px;min-width:0}
.pj-top{display:flex;align-items:flex-start;gap:10px}
.pj-name{flex:1;min-width:0;font:700 16px/1.35 var(--f-body);overflow-wrap:anywhere}
.pj-venue{font-weight:400;color:var(--mute);font-size:13px}
.pj-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:700;line-height:1;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag-up{border-color:rgba(255,198,64,.6);color:var(--accent)}
.tag-live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag-sample{border-style:dashed}
.tag-today{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag-late{background:rgba(255,90,106,.14);border-color:rgba(255,90,106,.6);color:#ff9aa5}
.tag-k{border-color:color-mix(in srgb,var(--c,#888) 60%,transparent);color:var(--c,var(--mute))}
.pj-prog{font:600 14px/1 var(--f-num);letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.pj-next{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.pj-next .k{display:inline-block;margin-right:7px;font:600 11px/1 var(--f-num);letter-spacing:.2em;color:var(--mute)}
.pj-next .d{font:600 15px/1 var(--f-num);font-variant-numeric:tabular-nums;margin-right:5px;color:var(--c)}
.pj-next.none,.pj-next.all{color:var(--mute)}
.meter{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.meter span{display:block;height:100%;background:var(--c);border-radius:2px}
.pj.past{opacity:.62}
.note-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);padding:8px 12px;border:1px dashed var(--line);border-radius:8px}
.note-row .btn{min-height:32px;font-size:13px;padding:0 12px}
.empty{padding:22px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* ---------- 締切 chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;max-width:100%;padding:5px 12px 5px 10px;border-radius:6px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--panel));text-align:left}
.chip:hover{background:color-mix(in srgb,var(--c) 17%,var(--panel))}
.chip-d{font:800 17px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--c)}
.chip-t{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-p{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.chip.late{border-color:rgba(255,90,106,.7)}
.chip.late .chip-d{color:var(--critical)}

/* ---------- calendar ---------- */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:14px}
.cal-nav h3{font:800 28px/1 var(--f-num);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:6.6em;text-align:center}
.nav-btn{width:42px;height:42px;border-radius:6px;border:1px solid rgba(255,198,64,.5);background:transparent;color:var(--accent);display:grid;place-items:center}
.nav-btn:hover{background:rgba(255,198,64,.1)}
.nav-btn svg{width:16px;height:16px}
.cal-sub{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;font-size:12px;color:var(--mute)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;flex:none}
.lg .l-ev{width:16px;height:9px;border-radius:3px;background:var(--accent)}
.lg .l-sp{width:16px;height:9px;border-radius:3px;border:1px dashed var(--accent)}
.lg .mk{--c:var(--ink)}
.cal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cal-head,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head span{padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:var(--mute);border-left:1px solid var(--line-soft);background:var(--panel2)}
.cal-head span:first-child{border-left:0}
.cal-head .sat{color:var(--sat)}.cal-head .sun{color:var(--sun)}
.week{border-top:1px solid var(--line);--cell-min:34px}
.cell{grid-row:1/-1;position:relative;min-width:0;padding:0;border:0;border-left:1px solid var(--line-soft);background:transparent;text-align:left}
.cell.c0{border-left:0}
.cell.off{background:rgba(0,0,0,.22)}
button.cell:hover{background:rgba(255,255,255,.035)}
button.cell:focus-visible{outline-offset:-2px}
.cell .num{position:absolute;top:4px;left:5px;min-width:20px;height:19px;padding:0 4px;border-radius:4px;font:600 15px/19px var(--f-num);font-variant-numeric:tabular-nums;text-align:center}
.cell.sat .num{color:var(--sat)}.cell.sun .num{color:var(--sun)}
.cell.today .num{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cell.sel{background:rgba(255,198,64,.08);box-shadow:inset 0 0 0 2px var(--accent)}
.bar,.dts{position:relative;z-index:1;pointer-events:none;min-width:0}
.bar{align-self:center;height:18px;margin:0 3px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.ev{background:var(--c);color:#15110a}
.bar.sp{line-height:16px;border:1px dashed var(--c);color:var(--c);background:rgba(255,255,255,.03);background:color-mix(in srgb,var(--c) 12%,transparent)}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.bar.sp.cl{border-left:0}.bar.sp.cr{border-right:0}
.bar.isdone{opacity:.45;text-decoration:line-through}
.dts{padding:2px 3px 6px;display:flex;flex-direction:column;gap:3px}
.dt{display:flex;align-items:center;gap:3px;font-size:10px;line-height:1.25;font-weight:500}
.dt b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dt.isdone{opacity:.42}.dt.isdone b{text-decoration:line-through}
.dt-more{font:600 11px/1 var(--f-num);color:var(--mute);padding-left:9px}
.mk{display:inline-block;flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.k-deadline>.mk,.mk.k-deadline{border-radius:1px;transform:rotate(45deg)}
.k-meeting>.mk,.mk.k-meeting{background:transparent;border:1.5px solid var(--c)}
.k-onsite>.mk,.mk.k-onsite{border-radius:1px}

/* ---------- agenda ---------- */
.ag-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--mute)}
.ag-from{font-weight:700;color:var(--ink)}
.ag-ctrl .btn{min-height:34px;font-size:13px;padding:0 12px}
.switch{display:inline-flex;align-items:center;gap:8px;margin-left:auto;min-height:34px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.agenda{display:flex;flex-direction:column;gap:12px}
.day{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 0 0;border-top:1px solid var(--line)}
.day-h{display:flex;align-items:center;gap:9px;min-width:0}
.day-d{font:800 30px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.day-w{font-size:14px;font-weight:700;color:var(--mute)}
.day-w.sat{color:var(--sat)}.day-w.sun{color:var(--sun)}
.day.is-today .day-d{color:var(--accent)}
.day-h .btn{margin-left:auto;min-height:34px;font-size:13px;padding:0 11px}
.day-h .brk{display:none}
.day.overdue .day-d{font:700 17px/1.3 var(--f-body);color:var(--critical);letter-spacing:.04em}
.ag-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.ag-item{display:flex;align-items:stretch;border-radius:9px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);min-width:0}
.ag-row{position:relative;flex:1;display:flex;align-items:flex-start;gap:11px;padding:10px 4px 10px 11px;min-width:0;cursor:pointer}
.ag-row input{position:absolute;opacity:0;width:22px;height:22px;margin:0}
.box{flex:none;width:22px;height:22px;margin-top:1px;border-radius:6px;border:2px solid color-mix(in srgb,var(--c) 75%,#fff 0%);display:grid;place-items:center;transition:background .12s}
.box svg{width:13px;height:13px;stroke:#15110a;opacity:0}
.ag-row input:checked+.box{background:var(--c);border-color:var(--c)}
.ag-row input:checked+.box svg{opacity:1}
.ag-row input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.ag-row input:disabled+.box{opacity:.4}
.ag-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ag-title{font-size:15px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.ag-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;font-size:12px;color:var(--mute)}
.pj-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;color:var(--c);font-weight:700}
.pj-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-item.isdone .ag-title{text-decoration:line-through;color:var(--mute)}
.ag-item.isdone{background:transparent}
.ag-item .icon-btn{align-self:center;margin-right:4px}
.ag-item.cont{background:transparent;border-style:dashed;border-left-style:solid}
.ag-item.cont .ag-row{padding-top:7px;padding-bottom:7px}
.ag-item.cont .ag-main{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.ag-item.cont .ag-title{font-size:13.5px;font-weight:500}
.ag-item.cont .icon-btn{height:34px}
.ag-event{align-items:center;gap:10px;padding:9px 12px;background:var(--c);border-color:var(--c);color:#15110a;font-weight:700}
.ag-event .ev-k{font:800 13px/1 var(--f-num);letter-spacing:.24em;padding:4px 7px 3px;border:1.5px solid #15110a;border-radius:4px;flex:none}
.ag-event .ev-n{min-width:0;overflow-wrap:anywhere;line-height:1.35}
.ag-none{font-size:13px;color:var(--mute);padding:4px 0 2px}
.ag-end{font-size:13px;color:var(--mute);text-align:center;padding:8px 0}
.more{align-self:center}
.foot{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.loading{padding:18px 16px;color:var(--mute);font-size:14px}

/* ---------- dialogs ---------- */
.dlg{padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(780px,calc(100% - 16px));max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:hidden}
.dlg[open]{display:flex;flex-direction:column}
.dlg::backdrop{background:rgba(5,4,9,.74)}
.dlg-sm{width:min(520px,calc(100% - 16px))}
.dlg-in{display:flex;flex-direction:column;flex:1;min-height:0}
.dlg-h{display:flex;align-items:center;gap:12px;padding:14px 10px 12px 18px;border-bottom:1px solid var(--line)}
.dlg-h>div{flex:1;min-width:0}
.dlg-h .eyebrow{font-size:11px}
.dlg-h h2{font:700 19px/1.3 var(--f-body);margin-top:6px}
.dlg-b{flex:1;min-height:0;overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.dlg-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.dlg-f .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--mute)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 11px;font-size:16px}
.fld textarea{padding:10px 11px;line-height:1.5;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.composer input:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.fld-row .fld-wide{grid-column:1/-1}
.dlg h3{font-size:15px;font-weight:700}
.swatches legend{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:7px;padding:0}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:38px;height:38px}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:100%;height:100%;border-radius:8px;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.attach{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px dashed rgba(255,198,64,.5);background:rgba(255,198,64,.04)}
.attach-actions{display:flex;flex-wrap:wrap;gap:8px}
.filelist{display:flex;flex-wrap:wrap;gap:6px}
.filelist li{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:12.5px}
.filelist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist li em{font-style:normal;font-weight:700;flex:none;color:var(--mute)}
.filelist li.ok em{color:var(--ok)}.filelist li.ng em{color:var(--critical)}.filelist li.busy em{color:var(--accent)}
.readnote{font-size:13px;line-height:1.55;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.readnote:empty{display:none}
.readnote.ok{color:var(--ok)}.readnote.err{color:#ff9aa5}.readnote.busy{color:var(--accent)}
.readnote .btn{min-height:32px;font-size:13px;padding:0 12px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,198,64,.3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rows{display:flex;flex-direction:column;gap:10px}
.rows-h{display:flex;align-items:baseline;gap:10px}
.count{font:600 14px/1 var(--f-num);letter-spacing:.06em;color:var(--mute)}
.rowlist{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;grid-template-areas:"date end del" "title title title" "kind kind kind";gap:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.row .a-date{grid-area:date}.row .a-end{grid-area:end}.row .a-title{grid-area:title}.row .a-kind{grid-area:kind}
.row .a-del{grid-area:del;align-self:end;width:44px;height:44px}
.row.isdone{opacity:.6}
.rows-empty{font-size:13px;color:var(--mute)}
.err{font-size:13px;color:#ff9aa5;font-weight:700}
.err:empty{display:none}
.chk-line{display:flex;align-items:center;gap:9px;min-height:44px;font-size:14px;cursor:pointer}
.chk-line input{width:20px;height:20px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:8px;background:var(--ink);color:#15110a;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- offline ---------- */
.offbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:12px 12px 12px 16px;border-radius:12px;border:1px solid rgba(255,198,64,.55);background:rgba(255,198,64,.07)}
.offbar-l{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.offbar-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:700;font-size:14px}
.pill{font:800 12px/1 var(--f-num);letter-spacing:.24em;padding:4px 7px 3px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.offbar-s{color:var(--mute)}
.offbar-s b{color:var(--accent);font-weight:700}
.offbar-s.warn{color:#ff9aa5;font-weight:700}
.steps{display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:flex-start;gap:12px;font-size:14px;max-width:72ch}
.steps .n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:800 15px/1 var(--f-num)}
.off-actions{display:flex;flex-wrap:wrap;gap:8px}
#off-note:empty{display:none}
#off-note{color:var(--accent)}
.imp-list{display:flex;flex-direction:column;gap:8px}
.imp-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.imp-list .tag{flex:none;margin-top:2px}
.tag-add{border-color:rgba(99,214,160,.6);color:var(--ok)}
.tag-upd{border-color:rgba(255,198,64,.6);color:var(--accent)}
.tag-del{border-color:rgba(255,90,106,.6);color:#ff9aa5}
.imp-name{min-width:0;font-weight:700;overflow-wrap:anywhere}
.imp-d{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--mute)}
.imp-warn{font-size:13px;color:#ff9aa5}
.imp-warn:empty{display:none}

@media (min-width:560px){
  .composer{grid-template-columns:minmax(0,1fr) auto}
}
@media (min-width:760px){
  .wrap{padding:44px 28px 72px;gap:44px}
  .sec-h .eyebrow{display:block}
  .summary{margin-top:-24px}
  .pj{grid-template-columns:8px 124px minmax(0,1fr)}
  .stub-d{font-size:38px}
  .pj-b{padding:14px 18px 15px 24px}
  .pj-name{font-size:17px}
  .week{--cell-min:56px}
  .cell .num{top:6px;left:7px;font-size:17px}
  .bar{height:20px;line-height:20px;font-size:11.5px;margin:0 5px}
  .bar.sp{line-height:18px}
  .dts{padding:3px 6px 8px}
  .dt{font-size:11.5px;gap:5px}
  .day{grid-template-columns:150px minmax(0,1fr);gap:18px;padding-top:16px}
  .day-h{align-items:flex-start;flex-wrap:wrap;align-content:flex-start;gap:6px 9px}
  .day-h .btn{margin-left:0;flex-basis:auto}
  .day-h .brk{display:block;flex-basis:100%;height:0}
  .day-d{font-size:36px}
  .row{grid-template-columns:150px 150px minmax(0,1fr) 112px 44px;grid-template-areas:"date end title kind del"}
  .fld-row.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)}
  .fld-row.three .fld-wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<template id="app-shell">
<div class="wrap">
  <div class="offbar" id="offbar" hidden>
    <div class="offbar-l" id="offbar-l"></div>
    <button type="button" class="btn btn-primary" data-act="export-changes">変更を書き出す</button>
  </div>
  <header class="top">
    <div class="top-l">
      <p class="eyebrow">Creative run sheet</p>
      <h1>クリエイティブ進行表</h1>
    </div>
    <p class="today" aria-label="今日の日付"><span class="today-k">TODAY</span><span class="today-d" id="today-d"></span><span class="today-w" id="today-w"></span></p>
  </header>
  <p class="summary" id="summary" aria-label="まとめ"></p>

  <section class="sec" id="sec-projects" aria-labelledby="h-projects">
    <div class="sec-h"><p class="eyebrow">Projects</p><h2 id="h-projects">案件</h2><span class="rule" aria-hidden="true"></span></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr" for="c-name">案件名</label>
      <input id="c-name" type="text" maxlength="80" placeholder="案件名を入力（例: 春の新作発表会）">
      <div class="composer-actions">
        <input id="c-files" class="sr" type="file" multiple accept="image/*,.pdf,.xlsx,.xlsm,.xls,.csv,.tsv,.txt,.md,.ics,.json">
        <label class="btn btn-attach" for="c-files" id="c-attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>スケジュールを添付</label>
        <button class="btn btn-primary" type="submit">追加</button>
      </div>
    </form>
    <p class="hint" id="c-hint">スケジュールを添付すると、日付とやることを読み取ってカレンダーに入れます。添付なしで「追加」を押すと手入力できます。</p>
    <div id="sample-note"></div>
    <ul class="pj-list" id="pj-list"><li class="loading">読み込み中…</li></ul>
  </section>

  <section class="sec" id="sec-due" aria-labelledby="h-due" hidden>
    <div class="sec-h"><p class="eyebrow">Deadlines</p><h2 id="h-due">締切が近いもの</h2><span class="rule" aria-hidden="true"></span></div>
    <p class="hint">2週間以内の締切と、過ぎてしまった締切です。押すとその日に移動します。</p>
    <div class="chips" id="chips"></div>
  </section>

  <section class="sec" id="sec-cal" aria-labelledby="h-cal">
    <div class="sec-h"><p class="eyebrow">Calendar</p><h2 id="h-cal">カレンダー</h2><span class="rule" aria-hidden="true"></span></div>
    <div class="cal-nav">
      <button type="button" class="nav-btn" data-act="prev" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h3 id="cal-title" aria-live="polite"></h3>
      <button type="button" class="nav-btn" data-act="next" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="cal-sub">
      <span class="lg"><i class="l-ev"></i>本番</span>
      <span class="lg"><i class="l-sp"></i>期間のある作業</span>
      <span class="lg"><i class="mk"></i>やること</span>
      <span class="lg"><i class="mk k-deadline"></i>締切</span>
      <span class="lg"><i class="mk k-meeting"></i>打合せ</span>
      <span class="lg"><i class="mk k-onsite"></i>現場</span>
    </div>
    <div class="cal">
      <div class="cal-head" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span><span class="sun">日</span></div>
      <div id="cal-grid"></div>
    </div>
  </section>

  <section class="sec" id="sec-agenda" aria-labelledby="h-agenda">
    <div class="sec-h"><p class="eyebrow">Day by day</p><h2 id="h-agenda">日ごとのやること</h2><span class="rule" aria-hidden="true"></span></div>
    <div class="ag-ctrl">
      <span class="ag-from" id="ag-from"></span>
      <button type="button" class="btn btn-ghost" id="ag-today" data-act="today" hidden>今日に戻る</button>
      <label class="switch" for="ag-done"><input type="checkbox" id="ag-done" checked>完了したものも表示</label>
    </div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section class="sec" id="sec-offline" aria-labelledby="h-offline" hidden>
    <div class="sec-h"><p class="eyebrow">Offline</p><h2 id="h-offline">PCでオフライン編集</h2><span class="rule" aria-hidden="true"></span></div>
    <ol class="steps">
      <li><span class="n">1</span><span>ネットがあるうちに「オフライン版を保存」を押して、今の内容が入ったファイルをPCに保存します。</span></li>
      <li><span class="n">2</span><span>ネットがないときは、そのファイルをダブルクリックして開きます。編集はそのPCに自動で保存されます。</span></li>
      <li><span class="n">3</span><span>ネットに戻ったら、オフライン版の「変更を書き出す」で変更ファイルを作り、ここの「変更を取り込む」で選びます。</span></li>
    </ol>
    <div class="off-actions">
      <button type="button" class="btn btn-primary" data-act="save-offline">オフライン版を保存</button>
      <input id="imp-file" class="sr" type="file" accept=".json,application/json">
      <label class="btn btn-ghost" for="imp-file" id="imp-label">変更を取り込む</label>
    </div>
    <p class="hint" id="off-note"></p>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<dialog class="dlg" id="pj-dlg" aria-labelledby="pj-dlg-title">
  <form class="dlg-in" id="pj-form" novalidate autocomplete="off">
    <header class="dlg-h">
      <div><p class="eyebrow">Project</p><h2 id="pj-dlg-title">案件を追加</h2></div>
      <button type="button" class="icon-btn" data-act="close-dlg" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="dlg-b">
      <label class="fld" for="f-name"><span>案件名</span><input id="f-name" type="text" maxlength="80"></label>
      <div class="fld-row three">
        <label class="fld" for="f-start"><span>本番日</span><input id="f-start" type="date"></label>
        <label class="fld" for="f-end"><span>最終日（複数日なら）</span><input id="f-end" type="date"></label>
        <label class="fld fld-wide" for="f-venue"><span>会場・エリア</span><input id="f-venue" type="text" maxlength="60" placeholder="例: 東京・有明"></label>
      </div>
      <fieldset class="swatches"><legend>カレンダーの色</legend><div class="sw-row" id="f-colors"></div></fieldset>

      <section class="attach" id="attach" aria-labelledby="h-attach">
        <h3 id="h-attach">スケジュールを添付して読み取る</h3>
        <p class="hint" id="attach-hint">画像・PDF・Excel・CSV・テキストに対応。選ぶとすぐ読み取って、下の一覧に入れます。色ぬりだけのガントチャートは画像かPDFのほうが正確です。</p>
        <div class="attach-actions" id="attach-actions">
          <input id="f-files" class="sr" type="file" multiple accept="image/*,.pdf,.xlsx,.xlsm,.xls,.csv,.tsv,.txt,.md,.ics,.json">
          <label class="btn btn-attach" for="f-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>ファイルを選ぶ</label>
          <button type="button" class="btn btn-ghost" data-act="toggle-paste" id="paste-toggle" aria-expanded="false" aria-controls="paste-box">文面を貼り付ける</button>
        </div>
        <div id="paste-box" hidden>
          <label class="fld" for="f-paste"><span>スケジュールの文面（メール本文など）</span><textarea id="f-paste" rows="5" placeholder="11/20 KV初稿提出&#10;11/25〜12/2 映像編集&#10;12/5 入稿"></textarea></label>
          <p style="margin-top:8px"><button type="button" class="btn btn-attach" data-act="read-paste">貼り付けた内容を読み取る</button></p>
        </div>
        <ul class="filelist" id="f-filelist"></ul>
        <p class="readnote" id="f-readnote" role="status" aria-live="polite"></p>
      </section>

      <section class="rows" aria-labelledby="h-rows">
        <div class="rows-h"><h3 id="h-rows">やること</h3><span class="count" id="f-count"></span></div>
        <ul class="rowlist" id="f-rows"></ul>
        <p><button type="button" class="btn btn-ghost" data-act="add-row">＋ 行を追加</button></p>
      </section>
      <p class="err" id="f-err" role="alert"></p>
    </div>
    <footer class="dlg-f">
      <button type="button" class="btn btn-danger" id="f-del" data-act="del-project" hidden>この案件を削除</button>
      <span class="grow"></span>
      <button type="button" class="btn btn-ghost" data-act="close-dlg">キャンセル</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </footer>
  </form>
</dialog>

<dialog class="dlg dlg-sm" id="task-dlg" aria-labelledby="task-dlg-title">
  <form class="dlg-in" id="task-form" novalidate autocomplete="off">
    <header class="dlg-h">
      <div><p class="eyebrow">Task</p><h2 id="task-dlg-title">やることを追加</h2></div>
      <button type="button" class="icon-btn" data-act="close-dlg" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="dlg-b">
      <label class="fld" for="t-project"><span>案件</span><select id="t-project"></select></label>
      <label class="fld" for="t-title"><span>内容</span><input id="t-title" type="text" maxlength="80"></label>
      <div class="fld-row">
        <label class="fld" for="t-date"><span>日付</span><input id="t-date" type="date"></label>
        <label class="fld" for="t-end"><span>終了日（期間なら）</span><input id="t-end" type="date"></label>
      </div>
      <label class="fld" for="t-kind"><span>種類</span><select id="t-kind"></select></label>
      <label class="chk-line" for="t-done"><input type="checkbox" id="t-done">完了にする</label>
      <p class="err" id="t-err" role="alert"></p>
    </div>
    <footer class="dlg-f">
      <button type="button" class="btn btn-danger" id="t-del" data-act="del-task" hidden>削除</button>
      <span class="grow"></span>
      <button type="button" class="btn btn-ghost" data-act="close-dlg">キャンセル</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </footer>
  </form>
</dialog>

<dialog class="dlg dlg-sm" id="imp-dlg" aria-labelledby="imp-title">
  <div class="dlg-in">
    <header class="dlg-h">
      <div><p class="eyebrow">Import</p><h2 id="imp-title">オフラインの変更を取り込む</h2></div>
      <button type="button" class="icon-btn" data-act="close-dlg" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="dlg-b">
      <p class="hint" id="imp-meta"></p>
      <ul class="imp-list" id="imp-list"></ul>
      <p class="imp-warn" id="imp-warn"></p>
    </div>
    <footer class="dlg-f">
      <span class="grow"></span>
      <button type="button" class="btn btn-ghost" data-act="close-dlg">キャンセル</button>
      <button type="button" class="btn btn-primary" data-act="apply-import" id="imp-apply">取り込む</button>
    </footer>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
</template>

<script id="app-js">
(function(){
'use strict';

/* the page markup lives in a template so an offline copy can be rebuilt from it */
var SHELL=document.getElementById('app-shell');
document.body.insertBefore(SHELL.content.cloneNode(true),SHELL);
var OFF=null;
try{var seedEl=document.getElementById('seed');if(seedEl){var sd=JSON.parse(seedEl.textContent);if(sd&&sd.format==='runsheet-offline'&&Array.isArray(sd.projects))OFF=sd;}}catch(e){OFF=null;}
var OFF_KEY=OFF?'runsheet.offline.'+String(OFF.exportId||'x').replace(/[^\w-]/g,'').slice(0,40):null;
var HAS_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
function use(n){return HAS_CLAUDE?Promise.resolve().then(function(){return window.claude.use(n);}).catch(function(){return null;}):Promise.resolve(null);}

var PAL=['#ff8a4c','#35d0ba','#7aa7ff','#ff6fb1','#b9e04b','#b48cff','#5fd0ff','#e6c9a0'];
var PAL_NAME=['オレンジ','ティール','ブルー','ピンク','ライム','バイオレット','シアン','サンド'];
var KIND={task:'やること',deadline:'締切',meeting:'打合せ',onsite:'現場'};
var KORD={onsite:0,deadline:1,meeting:2,task:3};
var WD=['日','月','火','水','木','金','土'];
var WDE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
var LS_KEY='runsheet.projects.v1';
var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var PDF_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDF_WORKER_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var EDIT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toDate(s){return new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));}
function isYmd(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(toDate(s))===s;}
function addDays(s,n){var d=toDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((toDate(b)-toDate(a))/864e5);}
function md(s){return pad(+s.slice(5,7))+'.'+pad(+s.slice(8,10));}
function wd(s){return toDate(s).getDay();}
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function due(t){return t.end||t.date;}
function byDate(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}

var TODAY=ymd(new Date());
var S={projects:[],loaded:false,mode:'loading',readOnly:false,slow:false,
  vy:+TODAY.slice(0,4),vm:+TODAY.slice(5,7)-1,sel:TODAY,anchor:TODAY,horizon:14,showDone:true};

/* ================= data shape ================= */
function normTask(t){
  if(!t||typeof t!=='object'||!isYmd(t.date))return null;
  var title=String(t.title==null?'':t.title).trim().slice(0,80);
  if(!title)return null;
  return {id:(typeof t.id==='string'&&t.id)?t.id.slice(0,40):uid('t'),date:t.date,
    end:(isYmd(t.end)&&t.end>t.date)?t.end:null,title:title,kind:KIND[t.kind]?t.kind:'task',done:!!t.done};
}
function normProject(id,d){
  if(!d||typeof d!=='object')return null;
  var name=String(d.name==null?'':d.name).trim().slice(0,80);
  if(!name)return null;
  var start=isYmd(d.start)?d.start:null;
  var c=Number.isInteger(d.color)?((d.color%PAL.length)+PAL.length)%PAL.length:0;
  return {id:String(id),name:name,start:start,end:(start&&isYmd(d.end)&&d.end>start)?d.end:null,
    venue:String(d.venue==null?'':d.venue).trim().slice(0,60),color:c,sample:!!d.sample,
    createdAt:typeof d.createdAt==='number'?d.createdAt:0,
    tasks:Array.isArray(d.tasks)?d.tasks.map(normTask).filter(Boolean).slice(0,400):[]};
}
function toDoc(p){
  return {name:p.name,start:p.start,end:p.end,venue:p.venue,color:p.color,sample:p.sample,createdAt:p.createdAt,
    tasks:p.tasks.map(function(t){return {id:t.id,date:t.date,end:t.end,title:t.title,kind:t.kind,done:t.done};})};
}
function sortedProjects(){
  return S.projects.slice().sort(function(a,b){
    var ae=a.start?(a.end||a.start):null,be=b.start?(b.end||b.start):null;
    var ap=ae&&ae<TODAY,bp=be&&be<TODAY;
    if(ap!==bp)return ap?1:-1;
    if(ap&&bp)return ae<be?1:ae>be?-1:0;
    var ak=a.start||'9999',bk=b.start||'9999';
    return ak<bk?-1:ak>bk?1:a.createdAt-b.createdAt;
  });
}
function getProject(id){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id)return S.projects[i];return null;}
function nextColor(){
  var used={};S.projects.forEach(function(p){used[p.color]=1;});
  for(var i=0;i<PAL.length;i++)if(!used[i])return i;
  return S.projects.length%PAL.length;
}

/* ================= storage ================= */
var col=null,pend=new Map(),deleting=new Set(),loadTimer=null;

function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.projects.map(function(p){var d=toDoc(p);d.id=p.id;return d;})));}catch(e){toast('この端末に保存できませんでした');}}
function loadLocal(){
  try{var raw=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
    if(Array.isArray(raw))return raw.map(function(d){return normProject(d&&d.id?d.id:uid('p'),d);}).filter(Boolean);
  }catch(e){}
  return [];
}
function startLocal(){col=null;S.mode='local';S.projects=loadLocal();S.loaded=true;renderAll();}

function startCloud(db){
  S.mode='cloud';
  if(A.cantWrite)S.readOnly=true;
  try{col=db.collection('projects');}catch(e){startLocal();return;}
  loadTimer=setTimeout(function(){S.slow=true;renderAll();},10000);
  col.onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.fromCache===false){clearTimeout(loadTimer);S.slow=false;}
    var remote=new Map();
    snap.docs.forEach(function(d){var p=normProject(d.id,d.data());if(p)remote.set(d.id,p);});
    var next=[];
    remote.forEach(function(p,id){
      if(deleting.has(id))return;
      next.push(pend.has(id)?(getProject(id)||p):p);
    });
    S.projects.forEach(function(p){if(pend.has(p.id)&&!remote.has(p.id))next.push(p);});
    S.projects=next;S.loaded=true;renderAll();
  },function(){
    clearTimeout(loadTimer);S.slow=false;
    if(!S.loaded){startLocal();toast('共有の保存先につながらないため、この端末に保存します');}
    else{S.readOnly=true;renderAll();toast('保存先との接続が切れました。ページを開き直してください');}
  });
}
function persist(p){
  if(S.mode==='local'){saveLocal();return;}
  if(S.mode==='offline'){saveOffline();return;}
  if(S.mode!=='cloud'||!col)return;
  var st=pend.get(p.id);
  if(!st){st={running:false,dirty:false,retried:false};pend.set(p.id,st);}
  st.dirty=true;
  if(!st.running)pump(p.id,st);
}
function pump(id,st){
  st.running=true;
  (function loop(){
    if(!st.dirty){st.running=false;pend.delete(id);return;}
    st.dirty=false;
    var p=getProject(id);
    if(!p){st.running=false;pend.delete(id);return;}
    col.doc(id).set(toDoc(p)).then(loop,function(e){
      if(e&&e.code==='unavailable'&&!st.retried){st.retried=true;st.dirty=true;setTimeout(loop,700+Math.random()*600);return;}
      st.running=false;pend.delete(id);
      if(e&&e.code==='invalid_argument'){S.readOnly=true;renderAll();toast('このページでは変更を保存できません（閲覧のみ）');}
      else if(e&&e.code==='quota_exceeded')toast('保存先がいっぱいです。古い案件を削除してください');
      else toast('保存できませんでした。もう一度試してください');
    });
  })();
}
function removeProject(id){
  S.projects=S.projects.filter(function(p){return p.id!==id;});
  if(S.mode==='local'){saveLocal();return;}
  if(S.mode==='offline'){saveOffline();return;}
  if(S.mode!=='cloud'||!col)return;
  deleting.add(id);
  var st=pend.get(id);if(st)st.dirty=false;
  (function wait(){
    var s=pend.get(id);
    if(s&&s.running){setTimeout(wait,150);return;}
    col.doc(id).delete().then(function(){deleting.delete(id);},function(){deleting.delete(id);toast('削除できませんでした。もう一度試してください');});
  })();
}

/* ================= derived data ================= */
function projStats(p){
  var total=p.tasks.length,done=0,next=null;
  p.tasks.forEach(function(t){if(t.done)done++;else if(!next||t.date<next.date)next=t;});
  var phase='none',label='本番日未定';
  if(p.start){
    var e=p.end||p.start;
    if(TODAY<p.start){phase='up';var n=diffDays(TODAY,p.start);label=n===1?'本番は明日':'本番まで'+n+'日';}
    else if(TODAY<=e){phase='live';label='本番中';}
    else{phase='past';label='終了';}
  }
  return {total:total,done:done,next:next,phase:phase,label:label};
}
function itemsOn(d){
  var ev=[],ts=[];
  sortedProjects().forEach(function(p){
    if(p.start&&p.start<=d&&d<=(p.end||p.start))ev.push(p);
    p.tasks.forEach(function(t){
      if(t.end){if(t.date<=d&&d<=t.end)ts.push({p:p,t:t,span:{i:diffDays(t.date,d)+1,n:diffDays(t.date,t.end)+1}});}
      else if(t.date===d)ts.push({p:p,t:t,span:null});
    });
  });
  ts.sort(function(a,b){return KORD[a.t.kind]-KORD[b.t.kind];});
  return {ev:ev,ts:ts};
}
function overdueList(){
  var out=[];
  sortedProjects().forEach(function(p){p.tasks.forEach(function(t){if(!t.done&&due(t)<TODAY)out.push({p:p,t:t});});});
  out.sort(function(a,b){return due(a.t)<due(b.t)?-1:due(a.t)>due(b.t)?1:0;});
  return out;
}
function hasItemsAfter(d){
  return S.projects.some(function(p){
    if(p.start&&(p.end||p.start)>d)return true;
    return p.tasks.some(function(t){return due(t)>d&&(S.showDone||!t.done);});
  });
}

/* ================= render ================= */
function renderAll(){
  var a=document.activeElement,fk=a&&a.dataset?a.dataset.fk:null;
  document.body.classList.toggle('ro',S.readOnly);
  renderHeader();renderProjects();renderChips();renderCalendar();renderAgenda();renderOffline();renderFoot();
  if(fk){var el=document.querySelector('[data-fk="'+fk.replace(/"/g,'')+'"]');if(el)try{el.focus({preventScroll:true});}catch(e){}}
}
function renderHeader(){
  $('#today-d').textContent=md(TODAY);
  $('#today-w').textContent=WDE[wd(TODAY)];
  var el=$('#summary');
  if(!S.loaded){el.innerHTML='';return;}
  var it=itemsOn(TODAY),todayN=it.ts.filter(function(x){return !x.t.done;}).length;
  var late=overdueList().length,lim=addDays(TODAY,14),dl=0,act=0;
  S.projects.forEach(function(p){
    var st=projStats(p);if(st.phase!=='past')act++;
    p.tasks.forEach(function(t){if(!t.done&&t.kind==='deadline'&&due(t)>=TODAY&&due(t)<=lim)dl++;});
  });
  el.innerHTML='<span class="stat">今日のやること<b>'+todayN+'</b></span>'+
    (late?'<span class="stat warn">遅れ<b>'+late+'</b></span>':'')+
    '<span class="stat">2週間以内の締切<b>'+dl+'</b></span>'+
    '<span class="stat">進行中の案件<b>'+act+'</b></span>';
}
function renderProjects(){
  var list=$('#pj-list'),note=$('#sample-note');
  if(!S.loaded){
    list.innerHTML='<li class="loading">'+(S.slow?'保存先にまだつながりません。つながり次第ここに表示します。':'読み込み中…')+'</li>';
    note.innerHTML='';return;
  }
  var ps=sortedProjects();
  note.innerHTML=ps.some(function(p){return p.sample;})?
    '<p class="note-row">見本のサンプル案件が入っています。自分の案件を入れたら消してください。<button type="button" class="btn btn-ghost" data-act="clear-samples">サンプルを消す</button></p>':'';
  if(!ps.length){
    list.innerHTML='<li class="empty"><span>案件はまだありません。上の欄に案件名を入れて追加してください。</span>'+
      (S.readOnly?'':'<button type="button" class="btn btn-ghost" data-act="add-samples">サンプルを入れて試す</button>')+'</li>';
    return;
  }
  list.innerHTML=ps.map(function(p){
    var st=projStats(p),pct=st.total?Math.round(st.done/st.total*100):0,stub;
    if(p.start){
      stub='<span class="stub-d">'+md(p.start)+'</span><span class="stub-w">'+WDE[wd(p.start)]+(p.end?' – '+md(p.end):'')+'</span><span class="stub-y">'+p.start.slice(0,4)+'</span>';
    }else stub='<span class="stub-d tbd">TBD</span><span class="stub-w">本番日未定</span>';
    var nx;
    if(st.next){
      var lateN=due(st.next)<TODAY?diffDays(due(st.next),TODAY):0;
      nx='<p class="pj-next"><span class="k">NEXT</span><span class="d">'+md(st.next.date)+'</span>'+esc(st.next.title)+
        (lateN?' <span class="tag tag-late">'+lateN+'日遅れ</span>':'')+'</p>';
    }else nx=st.total?'<p class="pj-next all">やることはすべて完了</p>':'<p class="pj-next none">やることは未登録。「詳細」から追加できます</p>';
    return '<li class="pj '+st.phase+'" style="--c:'+PAL[p.color]+'">'+
      '<span class="band" aria-hidden="true"></span>'+
      '<div class="stub">'+stub+'</div>'+
      '<div class="pj-b">'+
        '<div class="pj-top"><h3 class="pj-name">'+esc(p.name)+(p.venue?' <span class="pj-venue">（'+esc(p.venue)+'）</span>':'')+'</h3>'+
        '<button type="button" class="btn btn-line" data-act="open-project" data-p="'+esc(p.id)+'" data-fk="p:'+esc(p.id)+'">詳細</button></div>'+
        '<div class="pj-tags"><span class="tag tag-'+st.phase+'">'+st.label+'</span>'+(p.sample?'<span class="tag tag-sample">サンプル</span>':'')+
        '<span class="pj-prog">'+st.done+' / '+st.total+' 完了</span></div>'+nx+
        '<div class="meter" role="img" aria-label="進み具合 '+pct+'%"><span style="width:'+pct+'%"></span></div>'+
      '</div></li>';
  }).join('');
}
function renderChips(){
  var sec=$('#sec-due'),lim=addDays(TODAY,14),out=[];
  S.projects.forEach(function(p){p.tasks.forEach(function(t){
    if(!t.done&&t.kind==='deadline'&&due(t)<=lim)out.push({p:p,t:t});
  });});
  out.sort(function(a,b){return due(a.t)<due(b.t)?-1:due(a.t)>due(b.t)?1:0;});
  if(!S.loaded||!out.length){sec.hidden=true;return;}
  sec.hidden=false;
  $('#chips').innerHTML=out.slice(0,14).map(function(x){
    var d=due(x.t),late=d<TODAY;
    return '<button type="button" class="chip'+(late?' late':'')+'" style="--c:'+PAL[x.p.color]+'" data-act="goto" data-date="'+d+'">'+
      '<span class="chip-d">'+md(d)+'</span><span class="chip-t">'+esc(x.t.title)+'</span>'+
      (late?'<span class="tag tag-late">'+diffDays(d,TODAY)+'日遅れ</span>':'')+
      '<span class="chip-p">'+esc(x.p.name)+'</span></button>';
  }).join('');
}
function renderCalendar(){
  var y=S.vy,m=S.vm;
  $('#cal-title').textContent=y+'年'+(m+1)+'月';
  var lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cells=[],i,d;
  for(i=0;i<lead;i++)cells.push(null);
  for(d=1;d<=dim;d++)cells.push(y+'-'+pad(m+1)+'-'+pad(d));
  while(cells.length%7)cells.push(null);
  var ps=sortedProjects(),singles={};
  ps.forEach(function(p){p.tasks.forEach(function(t){if(!t.end)(singles[t.date]=singles[t.date]||[]).push({p:p,t:t});});});
  var html='';
  for(i=0;i<cells.length;i+=7)html+=weekHtml(cells.slice(i,i+7),ps,singles);
  $('#cal-grid').innerHTML=html;
}
function weekHtml(days,ps,singles){
  var vis=days.filter(Boolean),first=vis[0],last=vis[vis.length-1],segs=[];
  function push(a,b,meta){
    if(b<first||a>last)return;
    var s=a<first?first:a,e=b>last?last:b;
    meta.c0=days.indexOf(s);meta.c1=days.indexOf(e);meta.cl=a<s;meta.cr=b>e;segs.push(meta);
  }
  ps.forEach(function(p){
    if(p.start)push(p.start,p.end||p.start,{ev:true,p:p});
    p.tasks.forEach(function(t){if(t.end)push(t.date,t.end,{ev:false,p:p,t:t});});
  });
  segs.sort(function(a,b){return (b.ev?1:0)-(a.ev?1:0)||a.c0-b.c0||(b.c1-b.c0)-(a.c1-a.c0);});
  var lanes=[];
  segs.forEach(function(s){
    var i=0;
    while(lanes[i]&&lanes[i].some(function(r){return !(s.c1<r[0]||s.c0>r[1]);}))i++;
    (lanes[i]=lanes[i]||[]).push([s.c0,s.c1]);s.lane=i;
  });
  var n=lanes.length,rows='27px ';
  for(var k=0;k<n;k++)rows+='23px ';
  rows+='minmax(var(--cell-min),auto)';
  var h='<div class="week" style="grid-template-rows:'+rows+'">';
  days.forEach(function(d,i){
    if(!d){h+='<div class="cell off'+(i===0?' c0':'')+'" style="grid-column:'+(i+1)+'"></div>';return;}
    var w=wd(d),it=itemsOn(d),cnt=it.ts.length;
    var cls='cell'+(i===0?' c0':'')+(w===6?' sat':w===0?' sun':'')+(d===TODAY?' today':'')+(d===S.sel?' sel':'');
    var lab=(+d.slice(5,7))+'月'+(+d.slice(8,10))+'日 '+WD[w]+'曜'+(d===TODAY?' 今日':'')+(it.ev.length?' 本番あり':'')+(cnt?' やること'+cnt+'件':'');
    h+='<button type="button" class="'+cls+'" style="grid-column:'+(i+1)+'" data-act="pick" data-date="'+d+'" data-fk="c:'+d+'" aria-pressed="'+(d===S.sel)+'" aria-label="'+lab+'"><span class="num">'+(+d.slice(8,10))+'</span></button>';
  });
  segs.forEach(function(s){
    var label=s.ev?'本番｜'+s.p.name:s.t.title;
    h+='<div class="bar '+(s.ev?'ev':'sp')+(s.cl?' cl':'')+(s.cr?' cr':'')+(!s.ev&&s.t.done?' isdone':'')+'" style="--c:'+PAL[s.p.color]+';grid-column:'+(s.c0+1)+'/'+(s.c1+2)+';grid-row:'+(s.lane+2)+'">'+esc(label)+'</div>';
  });
  days.forEach(function(d,i){
    if(!d||!singles[d])return;
    var ts=singles[d].slice().sort(function(a,b){return KORD[a.t.kind]-KORD[b.t.kind];}),max=3;
    h+='<div class="dts" style="grid-column:'+(i+1)+';grid-row:'+(n+2)+'">'+ts.slice(0,max).map(function(x){
      return '<span class="dt k-'+x.t.kind+(x.t.done?' isdone':'')+'" style="--c:'+PAL[x.p.color]+'"><i class="mk"></i><b>'+esc(x.t.title)+'</b></span>';
    }).join('')+(ts.length>max?'<span class="dt-more">+'+(ts.length-max)+'</span>':'')+'</div>';
  });
  return h+'</div>';
}
function taskLi(p,t,opt){
  opt=opt||{};
  var meta='<span class="pj-chip"><span>'+esc(p.name)+'</span></span>';
  if(t.kind!=='task')meta+='<span class="tag tag-k">'+KIND[t.kind]+'</span>';
  if(opt.late)meta+='<span class="tag tag-late">'+md(due(t))+' から'+opt.late+'日遅れ</span>';
  if(opt.span)meta+='<span>'+md(t.date)+' – '+md(t.end)+'（'+opt.span.i+' / '+opt.span.n+'日目）</span>';
  else if(t.end&&opt.late)meta+='<span>'+md(t.date)+' – '+md(t.end)+'</span>';
  var key=(opt.key||'x')+':'+p.id+':'+t.id;
  return '<li class="ag-item k-'+t.kind+(t.done?' isdone':'')+(opt.span&&opt.span.i>1?' cont':'')+'" style="--c:'+PAL[p.color]+'">'+
    '<label class="ag-row"><input type="checkbox" data-act="toggle" data-p="'+esc(p.id)+'" data-t="'+esc(t.id)+'" data-fk="k:'+esc(key)+'"'+(t.done?' checked':'')+(S.readOnly?' disabled':'')+'>'+
    '<span class="box">'+CHECK_SVG+'</span>'+
    '<span class="ag-main"><span class="ag-title">'+esc(t.title)+'</span><span class="ag-meta">'+meta+'</span></span></label>'+
    '<button type="button" class="icon-btn" data-act="edit-task" data-p="'+esc(p.id)+'" data-t="'+esc(t.id)+'" data-fk="e:'+esc(key)+'" aria-label="「'+esc(t.title)+'」を編集">'+EDIT_SVG+'</button></li>';
}
function dayHtml(d,ev,ts,isAnchor){
  var w=wd(d),rel=d===TODAY?'今日':d===addDays(TODAY,1)?'明日':'';
  var h='<div class="day'+(d===TODAY?' is-today':'')+'" id="day-'+d+'"><div class="day-h">'+
    '<span class="day-d">'+md(d)+'</span><span class="day-w'+(w===6?' sat':w===0?' sun':'')+'">'+WD[w]+'</span>'+
    (rel?'<span class="tag tag-today">'+rel+'</span>':'')+'<span class="brk"></span>'+
    '<button type="button" class="btn btn-ghost" data-act="add-task" data-date="'+d+'" data-fk="a:'+d+'">＋ 追加</button></div><ul class="ag-list">';
  ev.forEach(function(p){
    h+='<li class="ag-item ag-event" style="--c:'+PAL[p.color]+'"><span class="ev-k">本番</span><span class="ev-n">'+esc(p.name)+(p.venue?'（'+esc(p.venue)+'）':'')+
      (p.end?' '+diffDaysLabel(p,d):'')+'</span></li>';
  });
  ts.forEach(function(x){h+=taskLi(x.p,x.t,{span:x.span,key:d});});
  if(!ev.length&&!ts.length&&isAnchor)h+='<li class="ag-none">この日のやることはありません。</li>';
  return h+'</ul></div>';
}
function diffDaysLabel(p,d){return (diffDays(p.start,d)+1)+' / '+(diffDays(p.start,p.end)+1)+'日目';}
function renderAgenda(){
  var a=S.anchor,box=$('#agenda');
  $('#ag-from').textContent=a===TODAY?'今日から先のやること':md(a)+'（'+WD[wd(a)]+'）から先のやること';
  $('#ag-today').hidden=a===TODAY;
  if(!S.loaded){box.innerHTML='<p class="loading">'+(S.slow?'保存先にまだつながりません。':'読み込み中…')+'</p>';return;}
  var h='';
  if(a===TODAY){
    var od=overdueList();
    if(od.length){
      h+='<div class="day overdue"><div class="day-h"><span class="day-d">遅れているもの</span></div><ul class="ag-list">'+
        od.map(function(x){return taskLi(x.p,x.t,{late:diffDays(due(x.t),TODAY),key:'late'});}).join('')+'</ul></div>';
    }
  }
  for(var i=0;i<S.horizon;i++){
    var d=addDays(a,i),it=itemsOn(d),ts=S.showDone?it.ts:it.ts.filter(function(x){return !x.t.done;});
    if(i>0&&!it.ev.length&&!ts.length)continue;
    h+=dayHtml(d,it.ev,ts,i===0);

function decodeText(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){try{return new TextDecoder('shift_jis').decode(buf);}catch(e2){return new TextDecoder().decode(buf);}}
}
function toJpeg(file){
  return createImageBitmap(file).then(function(bmp){
    var k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');
    cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',.9);});
  });
}
function readSheet(file){
  return loadScript(XLSX_URL).then(function(){return file.arrayBuffer();}).then(function(buf){
    var X=window.XLSX,wb=X.read(new Uint8Array(buf),{type:'array',cellNF:true,cellText:true}),out='';
    wb.SheetNames.slice(0,6).forEach(function(n){
      var ws=wb.Sheets[n];
      if(!ws||!ws['!ref']||out.length>70000)return;
      Object.keys(ws).forEach(function(k){
        if(k[0]==='!')return;
        var c=ws[k];
        try{
          if(c&&c.t==='n'&&c.z&&X.SSF.is_date(String(c.z))){
            var p=X.SSF.parse_date_code(c.v);
            if(p&&p.y>=1990)c.w=p.y+'-'+pad(p.m)+'-'+pad(p.d)+((p.H||p.M)?' '+pad(p.H)+':'+pad(p.M):'');
          }
        }catch(e){}
      });
      out+='\n# シート: '+n+'\n'+X.utils.sheet_to_csv(ws,{blankrows:false,strip:true})+'\n';
    });
    return out;
  });
}
function readPdf(file,maxImgs){
  return loadScript(PDF_WORKER_URL).then(function(){return loadScript(PDF_URL);}).then(function(){return file.arrayBuffer();}).then(function(buf){
    var lib=window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc=PDF_WORKER_URL;
    return lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  }).then(function(doc){
    var text='',images=[],n=Math.min(doc.numPages,12),i=1;
    function step(){
      if(i>n){try{doc.destroy();}catch(e){}return {text:text,images:images};}
      var no=i++;
      return doc.getPage(no).then(function(page){
        return page.getTextContent().then(function(tc){
          text+='\n# '+no+'ページ\n'+tc.items.map(function(it){return (it.str||'')+(it.hasEOL?'\n':' ');}).join('');
        },function(){}).then(function(){
          if(images.length>=maxImgs)return;
          var v0=page.getViewport({scale:1}),sc=Math.min(2.5,1500/Math.max(v0.width,v0.height)),vp=page.getViewport({scale:sc});
          var cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
          return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){
            return new Promise(function(res){cv.toBlob(function(b){if(b)images.push(b);res();},'image/jpeg',.88);});
          },function(){});
        });
      },function(){}).then(step);
    }
    return step();
  });
}
function collect(entries,pasted,limits,notes){
  var texts=[],images=[],budget=60000;
  var cap=limits&&limits.images?limits.images.maxCount:0;
  var okTypes=(limits&&limits.images&&limits.images.mediaTypes)||['image/jpeg','image/png','image/webp','image/gif'];
  function addText(name,t){
    t=String(t||'').replace(/\u0000/g,'').trim();
    if(!t||budget<=0)return false;
    if(t.length>budget){t=t.slice(0,budget);notes.push('「'+name+'」は長いため、前半だけ読み取りました。');}
    budget-=t.length;texts.push({name:name,text:t});return true;
  }
  if(pasted&&pasted.trim())addText('貼り付けた文面',pasted);
  var chain=Promise.resolve();
  entries.forEach(function(en){
    chain=chain.then(function(){
      var f=en.file,name=en.name,ext=(name.split('.').pop()||'').toLowerCase(),type=f.type||'';
      en.st='busy';renderFileList();
      var job;
      if(type.indexOf('image/')===0||['jpg','jpeg','png','webp','gif','heic','heif'].indexOf(ext)>=0){
        if(!cap){notes.push('「'+name+'」: この画面では画像を読み取れません。PDFかテキストで試してください。');job=Promise.resolve(false);}
        else if(images.length>=cap){notes.push('「'+name+'」: 画像は一度に'+cap+'枚までです。');job=Promise.resolve(false);}
        else job=(okTypes.indexOf(type)>=0?Promise.resolve(f):toJpeg(f)).then(function(b){images.push(b);return true;});
      }else if(type==='application/pdf'||ext==='pdf'){
        job=readPdf(f,cap?Math.max(0,Math.min(3,cap-images.length)):0).then(function(r){
          var ok=addText(name,r.text);
          r.images.forEach(function(b){images.push(b);});
          return ok||r.images.length>0;
        });
      }else if(['xlsx','xlsm','xls','xlsb','ods'].indexOf(ext)>=0||/spreadsheet|excel/.test(type)){
        job=readSheet(f).then(function(t){return addText(name,t);});
      }else if(type.indexOf('text/')===0||type==='application/json'||['txt','csv','tsv','md','ics','json','log'].indexOf(ext)>=0){
        job=f.arrayBuffer().then(function(b){return addText(name,decodeText(b));});
      }else{
        notes.push('「'+name+'」: この形式は読めません（画像・PDF・Excel・CSV・テキストに対応）。');job=Promise.resolve(false);
      }
      return job.then(function(ok){en.st=ok?'wait2':'ng';},function(){en.st='ng';notes.push('「'+name+'」: ファイルを開けませんでした。');}).then(renderFileList);
    });
  });
  return chain.then(function(){return {texts:texts,images:images};});
}

    '- tasks は日付の早い順。1つの作業につき1件。title は資料の言葉をそのまま使い、40文字以内にする。',
    '- 期間のある作業（例: 11/20〜11/27 デザイン制作）は date に開始日、end に終了日。1日だけの予定は end を null。',
    '- kind は次の4つから選ぶ: 締切・提出・入稿・校了・納品・FIX は "deadline"、打合せ・MTG・定例・確認会・プレゼンは "meeting"、搬入・設営・リハーサル・立ち会い・撤去など現場作業は "onsite"、それ以外は "task"。',
    '- 本番そのものは tasks に入れず eventStart / eventEnd に入れる。',
    '- 資料にない予定は作らない。日付を読み取れない項目は入れない。'
  ];
  pack.texts.forEach(function(t,i){L.push('','===== 資料'+(i+1)+': '+t.name+' =====',t.text);});
  if(pack.images.length)L.push('','（このほかに画像が'+pack.images.length+'枚あります。スケジュール表の写真・スクリーンショット、またはPDFのページです。画像の中の日付と作業名も読み取ってください。）');
  return L.join('\n');
}
function applyRead(data){
  if(!data||typeof data!=='object')return {n:0,ev:false};
  var ev=false;
  if(isYmd(data.eventStart)&&!$('#f-start').value){
    $('#f-start').value=data.eventStart;ev=true;
    if(isYmd(data.eventEnd)&&data.eventEnd>data.eventStart&&!$('#f-end').value)$('#f-end').value=data.eventEnd;
  }
  if(typeof data.venue==='string'&&data.venue.trim()&&!$('#f-venue').value.trim())$('#f-venue').value=data.venue.trim().slice(0,60);
  var seen={},n=0;
  D.tasks.forEach(function(t){seen[t.date+'|'+String(t.title).trim()]=1;});
  (Array.isArray(data.tasks)?data.tasks.slice(0,300):[]).forEach(function(r){
    var t=normTask({date:r&&r.date,end:r&&r.end,title:r&&r.title,kind:r&&r.kind});
    if(!t)return;
    var k=t.date+'|'+t.title;if(seen[k])return;seen[k]=1;
    D.tasks.push(t);n++;
  });
  D.tasks.sort(function(a,b){var x=a.date||'9999',y=b.date||'9999';return x<y?-1:x>y?1:0;});
  renderRows();
  return {n:n,ev:ev};
}
function readErrorCopy(e){
  var c=e&&e.code;
  if(c==='cancelled')return '読み取りを中止しました。';
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')return '自動読み取りが許可されていないため使えません。下の「やること」に手入力してください。';
  if(c==='rate_limited')return 'いま混み合っています。少し待ってから、もう一度添付してください。';
  if(c==='session_expired')return 'サインインし直してから、もう一度添付してください。';
  if(c==='image_rejected'||c==='images_unavailable')return 'この画像は読み取れませんでした。別の画像か、PDF・テキストで試してください。';
  if(c==='prompt_too_large')return '資料が大きすぎます。必要なページやシートだけにして、もう一度添付してください。';
  if(c==='refused'||c==='empty_completion'||c==='invalid_json')return 'うまく読み取れませんでした。もう一度添付するか、手入力してください。';
  if(c==='nothing')return '読み取れる内容がありませんでした。';
  if(c==='script')return '読み取りの準備ができませんでした。通信状況を確認して、もう一度添付してください。';
  return '通信エラーで読み取れませんでした。もう一度添付してください。';
}
function runRead(entries,pasted){
  if(R.busy){toast('いま読み取り中です。終わってからもう一度選んでください');entries.forEach(function(en){en.st='ng';});renderFileList();return;}
  R.busy=true;R.ctl=new AbortController();
  var notes=[],signal=R.ctl.signal,mine=D;
  setReadNote('busy','資料を開いています…',true);
  A.ready.then(function(sample){
    if(!sample)throw {code:'not_granted'};
    return sample.limits().catch(function(){return null;}).then(function(lim){
      return collect(entries,pasted,lim,notes);
    }).then(function(pack){
      if(signal.aborted)throw {code:'cancelled'};
      if(!pack.texts.length&&!pack.images.length)throw {code:'nothing'};
      setReadNote('busy','読み取り中… 30秒〜1分ほどかかることがあります',true);
      entries.forEach(function(en){if(en.st==='wait2')en.st='busy';});renderFileList();
      var opt={signal:signal};
      if(pack.images.length)opt.images=pack.images;
      return sample.json(buildPrompt($('#f-name').value.trim(),pack),opt);
    });
  }).then(function(data){
    if(!D||D!==mine)return;
    var r=applyRead(data);
    entries.forEach(function(en){if(en.st==='busy')en.st='ok';});
    var msg=r.n?r.n+'件のやることを読み取りました'+(r.ev?'（本番日も入れました）':'')+'。下の一覧で確認・修正してから保存してください。':
      (r.ev?'本番日を読み取りました。日付つきのやることは見つかりませんでした。':'日付つきの予定が見つかりませんでした。別の資料で試すか、手入力してください。');
    setReadNote(r.n||r.ev?'ok':'err',msg+(notes.length?' '+notes.join(' '):''));
  },function(e){
    entries.forEach(function(en){if(en.st!=='ng')en.st=(e&&e.code==='cancelled')?'stop':'ng';});
    if(D!==mine)return;
    var c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'){A.sampleState='off';updateAttachUI();renderFoot();}
    if(e&&!e.code&&e.message==='script')e={code:'script'};
    setReadNote('err',readErrorCopy(e)+(notes.length?' '+notes.join(' '):''));
  }).then(function(){R.busy=false;R.ctl=null;renderFileList();});
}

function withId(p){var d=toDoc(p);d.id=p.id;return d;}
function stamp(d){return pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());}
function fmtWhen(v){var d=new Date(v);if(isNaN(d))return '';return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function canonT(t){return [t.date,t.end||'',t.title,t.kind,t.done?1:0].join('\u0001');}
function canonP(p){return JSON.stringify([p.name,p.start||'',p.end||'',p.venue||'',p.color,p.tasks.map(function(t){return t.id+'\u0002'+canonT(t);}).sort()]);}
function toMap(arr){
  var m=new Map();
  (Array.isArray(arr)?arr:[]).forEach(function(d){if(!d||typeof d.id!=='string'||!d.id)return;var p=normProject(d.id.slice(0,60),d);if(p)m.set(p.id,p);});
  return m;
}
function diffList(base,cur){
  var B=new Map(base.map(function(p){return [p.id,p];})),C=new Set(cur.map(function(p){return p.id;})),out=[];
  cur.forEach(function(p){var b=B.get(p.id);if(!b)out.push('add');else if(canonP(b)!==canonP(p))out.push('edit');});
  base.forEach(function(b){if(!C.has(b.id))out.push('del');});
  return out;
}

function saveFile(name,text,mime){

      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},5000);

    }catch(e){toast('ファイルを保存できませんでした');return Promise.resolve(false);}
  }
  return use('downloads').then(function(dl){
    if(!dl){toast('この画面ではファイルを保存できません。PCのブラウザで開いてください');return false;}
    return dl.save({filename:name,data:text}).then(function(){return true;},function(e){
      var c=e&&e.code;
      if(c==='declined')return false;
      toast(c==='rate_limited'?'保存の確認がすでに開いています。閉じてからもう一度押してください':'ファイルを保存できませんでした');

/* bringing offline edits back: three-way merge against the snapshot the offline file started from */
function mergeTasks(bt,ot,nt){
  var ix=function(a){var m={};a.forEach(function(t){m[t.id]=t;});return m;};
  var B=ix(bt),Ot=ix(ot),N=ix(nt),seen={},out=[];
  nt.concat(ot,bt).forEach(function(t){
    if(seen[t.id])return;seen[t.id]=1;
    var id=t.id,b=B[id],o=Ot[id],n=N[id];
    if(o&&b){if(canonT(o)!==canonT(b))out.push(o);else if(n)out.push(n);}
    else if(o)out.push(o);
    else if(b){if(n&&canonT(n)!==canonT(b))out.push(n);}
    else if(n)out.push(n);
  });
  return out.map(function(t){return {id:t.id,date:t.date,end:t.end,title:t.title,kind:t.kind,done:t.done};}).sort(byDate);
}
function mergeProject(b,o,n){
  var m={id:n.id,name:n.name,start:n.start,end:n.end,venue:n.venue,color:n.color,sample:n.sample&&o.sample,createdAt:n.createdAt,tasks:[]};
  if(!b||o.name!==b.name)m.name=o.name;
  if(!b||o.start!==b.start||o.end!==b.end){m.start=o.start;m.end=o.end;}
  if(!b||o.venue!==b.venue)m.venue=o.venue;
  if(!b||o.color!==b.color)m.color=o.color;
  m.tasks=mergeTasks(b?b.tasks:[],o.tasks,n.tasks);
  return m;
}
function taskDelta(n,m){
  var N={},M={},a=0,c=0,r=0,parts=[];
  n.tasks.forEach(function(t){N[t.id]=t;});m.tasks.forEach(function(t){M[t.id]=t;});
  m.tasks.forEach(function(t){if(!N[t.id])a++;else if(canonT(N[t.id])!==canonT(t))c++;});
  n.tasks.forEach(function(t){if(!M[t.id])r++;});
  if(n.name!==m.name||n.start!==m.start||n.end!==m.end||n.venue!==m.venue||n.color!==m.color)parts.push('案件の情報');
  if(a)parts.push('やること追加 '+a);
  if(c)parts.push('変更・完了 '+c);
  if(r)parts.push('削除 '+r);
  return parts.join(' / ');
}
function planImport(pkg){
  var B=toMap(pkg.baseline),Oc=toMap(pkg.current),N=new Map(S.projects.map(function(p){return [p.id,p];})),ops=[];
  Oc.forEach(function(o,id){
    var b=B.get(id),n=N.get(id);
    if(b&&canonP(o)===canonP(b))return;
    if(!n){ops.push({type:'add',name:o.name,p:o,again:!!b});return;}
    var m=mergeProject(b||null,o,n);
    if(canonP(m)===canonP(n))return;
    ops.push({type:'update',name:m.name,p:m,detail:taskDelta(n,m),conflict:!!(b&&canonP(n)!==canonP(b))});
  });
  B.forEach(function(b,id){
    if(Oc.has(id))return;
    var n=N.get(id);if(!n)return;
    if(canonP(n)===canonP(b))ops.push({type:'delete',name:n.name,id:id});
    else ops.push({type:'keep',name:n.name});
  });
  return ops;
}
function readImport(file){

      toast(/runsheet-offline/.test(txt)&&/<html/i.test(txt)?'これはオフライン版のファイルです。そのファイルを開いて「変更を書き出す」で作った .json を選んでください':'進行表の変更ファイルではありません。オフライン版の「変更を書き出す」で作った .json を選んでください');
      return;
    }
    showImport(pkg,planImport(pkg));

    arm(el,function(){var id=D&&D.id;abortRead();closeDlg(pjDlg);D=null;if(id){removeProject(id);renderAll();toast('案件を削除しました');}});
  }else if(act==='del-task')arm(el,deleteTask);
  else if(act==='save-offline')saveOfflineVersion();
  else if(act==='export-changes')exportChanges();
  else if(act==='apply-import')applyImport();
  else if(act==='clear-samples'){
    S.projects.filter(function(p){return p.sample;}).map(function(p){return p.id;}).forEach(removeProject);
    renderAll();toast('サンプルを消しました');
  }else if(act==='add-samples'){
    sampleProjects().forEach(function(p){S.projects.push(p);persist(p);});renderAll();
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.act==='toggle'){toggleTask(el.dataset.p,el.dataset.t,el.checked);return;}
  if(el.id==='ag-done'){S.showDone=el.checked;renderAgenda();return;}
  if(el.id==='c-files'){var fs=Array.prototype.slice.call(el.files||[]);el.value='';if(fs.length)openProject(null,{name:$('#c-name').value.trim(),files:fs});return;}
  if(el.id==='imp-file'){var f3=el.files&&el.files[0];el.value='';if(f3)readImport(f3);return;}
  if(el.id==='f-files'){var f2=Array.prototype.slice.call(el.files||[]);el.value='';addFiles(f2);return;}
});
$('#f-rows').addEventListener('input',function(ev){
  var el=ev.target,row=el.closest('[data-row]');
  if(!row||!el.dataset.f)return;
  var t=draftTask(row.dataset.row);if(!t)return;
  t[el.dataset.f]=el.dataset.f==='title'?el.value:(el.value||null);
});
$('#f-rows').addEventListener('change',function(ev){
  var el=ev.target,row=el.closest('[data-row]');
  if(!row||!el.dataset.f)return;
  var t=draftTask(row.dataset.row);if(!t)return;
  t[el.dataset.f]=el.dataset.f==='title'?el.value:(el.value||null);
});
$('#composer').addEventListener('submit',function(ev){ev.preventDefault();openProject(null,{name:$('#c-name').value.trim()});});
$('#pj-form').addEventListener('submit',function(ev){ev.preventDefault();saveProjectForm();});
$('#task-form').addEventListener('submit',function(ev){ev.preventDefault();saveTaskForm();});
pjDlg.addEventListener('close',function(){abortRead();});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  var now=ymd(new Date());
  if(now!==TODAY){var was=TODAY;TODAY=now;if(S.sel===was)S.sel=now;if(S.anchor===was)S.anchor=now;renderAll();}
});

/* ================= boot ================= */
function boot(){
  if(OFF){A.sampleState='off';A.ready=Promise.resolve(null);updateAttachUI();startOffline();return;}
  renderAll();
  A.ready=use('sample').then(function(s){A.sample=s||null;A.sampleState=s?'on':'off';updateAttachUI();renderFoot();return A.sample;});
  use('user').then(function(u){
    if(!u||typeof u.can!=='function')return;
    return u.can('data.write').then(function(ok){if(ok===false){A.cantWrite=true;if(S.mode==='cloud'){S.readOnly=true;renderAll();}}});
  }).catch(function(){});
  use('db').then(function(db){if(db)startCloud(db);else startLocal();});
}
boot();
})();
</script>
